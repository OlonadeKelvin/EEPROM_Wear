yaml_version: 2

project:
  title: "Hardware EEPROM Wear-Leveling Controller"
  author: "Olonade Kelvin"
  description: >
    A fully digital wear‑leveling FSM for external EEPROM or flash memories.
    It implements dynamic wear‑levelling with configurable threshold and
    automatic logical‑to‑physical remapping.
  tiles: "1"                        # Single tile
  source_files:
    - src/project.v
  clock_hz: "10000000"              # 10 MHz (passed as string)
  top_module: tt_um_wearlevel_controller
  language: verilog

pinout:
  # 8 inputs
  ui[0]: "Logical address bit 0"
  ui[1]: "Logical address bit 1"
  ui[2]: "Logical address bit 2"
  ui[3]: "Command bit 0"
  ui[4]: "Command bit 1"
  ui[5]: "move_ack (host acknowledges data move)"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # 8 outputs
  uo[0]: "Physical address bit 0"
  uo[1]: "Physical address bit 1"
  uo[2]: "Physical address bit 2"
  uo[3]: "Busy flag"
  uo[4]: "move_request"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # 8 bidirectional
  uio[0]: "Destination physical address bit 0 (output during move)"
  uio[1]: "Destination physical address bit 1 (output during move)"
  uio[2]: "Destination physical address bit 2 (output during move)"
  uio[3]: "Unused (output enable 0)"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"
