project:
  title: "Hardware EEPROM Wear-Leveling Controller"
  author: "Olonade Kelvin"
  description: >
    A fully digital wear‑leveling FSM for external EEPROM or flash memories.
    It implements dynamic wear‑levelling with configurable threshold and
    automatic logical‑to‑physical remapping. Ideal for edge‑device storage
    reliability enhancement.
  tiles: "sky130"                     # Tile type for SKY26b (SkyWater 130 nm)
  source_files:
    - src/project.v
  clock_hz: 10_000_000                # 10 MHz, easily meets timing
  top_module: tt_um_wearlevel_controller
  language: verilog

pinout:
  # Inputs (ui[7:0] = ui_in in verilog)
  ui[0]: "Logical address bit 0"
  ui[1]: "Logical address bit 1"
  ui[2]: "Logical address bit 2"
  ui[3]: "Command bit 0"
  ui[4]: "Command bit 1"
  ui[5]: "move_ack (host acknowledges data move)"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs (uo[7:0] = uo_out)
  uo[0]: "Physical address bit 0"
  uo[1]: "Physical address bit 1"
  uo[2]: "Physical address bit 2"
  uo[3]: "Busy flag (high during write‑commit sequence)"
  uo[4]: "move_request (high when data relocation is needed)"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional (uio[7:0] = uio_in / uio_out / uio_oe)
  uio[0]: "Destination physical address bit 0 (output during move)"
  uio[1]: "Destination physical address bit 1 (output during move)"
  uio[2]: "Destination physical address bit 2 (output during move)"
  uio[3]: "Unused (bidir, output enable 0)"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

  # Control signals
  ena: "Enable signal (active high)"
  clk: "Clock input"
  rst_n: "Active-low reset"
