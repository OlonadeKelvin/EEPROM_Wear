---
# info.yaml
yaml_version: 6

project:
  title: "Hardware EEPROM Wear-Leveling Controller"
  author: "Olonade Kelvin"
  description: >
    A fully digital wear-leveling FSM for external EEPROM or flash memories.
    It implements dynamic wear-leveling with configurable threshold and
    automatic logical-to-physical remapping.
  tiles: "1x1"                      # Changed to valid v6 dimension format
  source_files:
    - project.v                     # Ensure this path matches where your .v file is inside src/
  clock_hz: 10000000                # Removed quotes so it is read as an integer
  top_module: tt_um_wearlevel_controller
  language: verilog

pinout:
  # 8 inputs
  ui[0]: "Logical address bit 0"
  ui[1]: "Logical address bit 1"
  ui[2]: "Logical address bit 2"
  ui[3]: "Command bit 0"
  ui[4]: "Command bit 1"
  ui[5]: "move_ack (host acknowledges data move)"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # 8 outputs
  uo[0]: "Physical address bit 0"
  uo[1]: "Physical address bit 1"
  uo[2]: "Physical address bit 2"
  uo[3]: "Busy flag"
  uo[4]: "move_request"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # 8 bidirectional
  uio[0]: "Destination physical addr bit 0"
  uio[1]: "Destination physical addr bit 1"
  uio[2]: "Destination physical addr bit 2"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"
